# Dva servisa, kot pravi kriterij V1-R02: `api` in `db`. Brez Celery in Redisa —
# obseg (5–25 slik na teden) ju ne potrebuje.
#
# Vrednosti pridejo iz `apps/server/.env` (glej `okolje.primer`).

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: solski
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni nastavljen}
      POSTGRES_DB: solski
    volumes:
      - podatki-baze:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solski -d solski"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    environment:
      API_KEY: ${API_KEY:?API_KEY ni nastavljen}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://solski:${POSTGRES_PASSWORD}@db:5432/solski}
      IMAGES_DIR: /data/images
      # Brez tega ključa strežnik vseeno steče in slike sprejema — ne teče
      # samo obdelava (`docs/odlocitve/ADR-009`). Zato `:-` in ne `:?`:
      # napačno nastavljen ključ ne sme ustaviti prevzema slik s telefona.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
    volumes:
      - slike:/data/images
    ports:
      # Samo Tailscale naslov tega stroja. Privzetek 127.0.0.1 je namenoma
      # neuporaben od zunaj: raje ne dela, kot da je odprt v domače omrežje.
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Shema se postavi ob zagonu; brez tega bi bila prva zahteva 500.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    restart: unless-stopped

volumes:
  podatki-baze:
  slike:
