[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-companion-server"
version = "1.0.0"
description = "Sprejem fotografij ucne snovi s telefona (V1-R02)."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "httpx"]

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "A",   # builtins v sencah
    "SIM", # poenostavitve
    "PTH", # pathlib namesto os.path
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Alembic generira predlogo z imeni, ki jih ne obvladujemo.
"alembic/*" = ["I001"]

[tool.pytest.ini_options]
# `verify.ps1` poganja `pytest apps/server` iz korena repozitorija. Rootdir
# postane `apps/server` (tu je ta nastavitev), zato je `.` prav ta mapa in
# `import app` deluje brez namestitve paketa.
pythonpath = ["."]
testpaths = ["tests"]
