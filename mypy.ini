# Nastavitve za `mypy apps/server`.
#
# Zakaj v korenu in ne v `apps/server/pyproject.toml`: `scripts/verify.ps1`
# kliče `mypy apps/server` iz korena repozitorija, mypy pa nastavitve išče v
# trenutni mapi, ne v ciljni. Nastavitev v `apps/server` torej ne bi bila
# prebrana. Skripte ne spreminjamo (CLAUDE.md, trdi rob 4) — prilagodimo se ji.
#
# `ruff` in `pytest` te težave nimata: ruff išče nastavitve navzgor od vsake
# datoteke, pytest pa od podanega argumenta. Njuna nastavitev zato ostane v
# `apps/server/pyproject.toml`.

[mypy]
python_version = 3.12
mypy_path = apps/server
namespace_packages = False

# Virtualno okolje ni naša koda. Prav tako ne `build/`, ki nastane ob
# `pip wheel` — mapa je v `.gitignore`, a mypy se po njem ne ravna in bi
# vsakomur, ki je kdaj zgradil paket, javil podvojen modul `app`.
#
# `verify.ps1` kolesa ne gradi; ročno pa ga zgradi vsak, ki preveri, da so
# predloge res v nameščenem paketu (odločitev 9 v `docs/plan/V1-R04.md`), in
# ta potem dobi rdeč `mypy` iz razloga, ki s kodo nima zveze.
exclude = (?x)(^apps/server/\.venv/|/\.venv/|^apps/server/build/)

disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
strict_equality = True
